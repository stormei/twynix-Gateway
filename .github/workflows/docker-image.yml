name: Build and publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: stormei/twynix-gateway

jobs:
  build-and-push:
    name: Build and push gateway image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME}"
          VERSION="${VERSION#v}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tags=ghcr.io/stormei/twynix-gateway:${VERSION},ghcr.io/stormei/twynix-gateway:latest" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-12)"
            echo "version=dev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "tags=ghcr.io/stormei/twynix-gateway:dev-${SHORT_SHA},ghcr.io/stormei/twynix-gateway:main" >> "$GITHUB_OUTPUT"
          fi

          echo "short_sha=$(echo "${GITHUB_SHA}" | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            BUILD_SHA=${{ steps.meta.outputs.short_sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=TwynIX Gateway
            org.opencontainers.image.description=TwynIX OPC UA to MQTT / ThingsBoard gateway
            org.opencontainers.image.source=https://github.com/stormei/twynix-Gateway
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
